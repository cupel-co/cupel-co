name: Integrate

on:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref_name }}'

jobs:
  version:
    name: Version
    uses: cupel-co/workflows/.github/workflows/version.generate.yml@74059a4ad22af5af5e398b7ac494ad3cb6bb17a3

  release:
    name: Release
    uses: cupel-co/workflows/.github/workflows/release.create.yml@74059a4ad22af5af5e398b7ac494ad3cb6bb17a3
    needs:
      - version
    permissions:
      contents: write
    with:
      tag: 'v${{ needs.version.outputs.sem-ver }}'
    secrets:
      google-chat-webhook-url: '${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}'
      gpg-private-key: '${{ secrets.GH_GPG_PRIVATE_KEY }}'
      gpg-private-key-password: '${{ secrets.GH_GPG_PRIVATE_KEY_PASSWORD }}'
      token: '${{ secrets.GH_RELEASE_PAT }}'
